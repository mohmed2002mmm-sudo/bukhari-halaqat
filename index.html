<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - مجمع الإمام البخاري</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #0369a1;
            --secondary: #0284c7;
            --light-blue: #e0f2fe;
            --sky-tint: #f0f9ff;
            --danger: #e63946;
            --dark: #1e293b;
            --gray: #64748b;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
        body {
            background: linear-gradient(135deg, #bae6fd 0%, #e0f2fe 55%, #f0f9ff 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: var(--dark);
        }

        .login-card {
            background: #ffffff;
            width: 100%;
            max-width: 440px;
            border-radius: 18px;
            padding: 32px 28px;
            border: 1px solid #bae6fd;
            box-shadow: 0 14px 35px rgba(3, 105, 161, 0.14);
        }

        .login-header {
            text-align: center;
            margin-bottom: 24px;
        }
        .login-header i {
            font-size: 2.5rem;
            color: var(--primary);
            background: var(--light-blue);
            width: 68px;
            height: 68px;
            line-height: 68px;
            border-radius: 50%;
            margin-bottom: 12px;
        }
        .login-header h1 {
            font-size: 1.4rem;
            color: var(--primary);
            font-weight: 900;
        }
        .login-header p {
            color: var(--gray);
            font-size: 0.92rem;
            margin-top: 4px;
        }

        .form-group {
            margin-bottom: 16px;
            text-align: right;
        }
        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-weight: 700;
            font-size: 0.92rem;
            color: var(--dark);
        }
        .form-control {
            width: 100%;
            padding: 11px 14px;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            font-size: 0.95rem;
            background-color: var(--sky-tint);
            color: var(--dark);
            transition: 0.2s;
        }
        .form-control:focus {
            border-color: var(--secondary);
            background-color: #ffffff;
            outline: none;
        }

        .password-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }
        .password-wrapper .form-control {
            padding-left: 44px;
        }
        .toggle-password-btn {
            position: absolute;
            left: 10px;
            background: transparent;
            border: none;
            color: var(--gray);
            cursor: pointer;
            font-size: 1rem;
            padding: 6px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: color 0.2s;
        }
        .toggle-password-btn:hover {
            color: var(--primary);
        }

        .btn-login {
            width: 100%;
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 800;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 10px;
        }
        .btn-login:hover:not(:disabled) {
            background-color: var(--secondary);
            transform: translateY(-1px);
        }
        .btn-login:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .error-msg {
            background-color: #f8d7da;
            color: #842029;
            padding: 10px 12px;
            border-radius: 8px;
            font-size: 0.88rem;
            font-weight: 700;
            margin-bottom: 14px;
            display: none;
            text-align: center;
        }
    </style>

    <!-- تحميل مكتبة Supabase والملف السحابي -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="storage.js"></script>
</head>
<body>

    <div class="login-card">
        <div class="login-header">
            <i class="fa-solid fa-mosque"></i>
            <h1>مجمع الإمام البخاري</h1>
            <p>تسجيل الدخول إلى النظام الإداري</p>
        </div>

        <div id="login-error" class="error-msg"></div>

        <form id="login-form" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label for="login-username">اسم المستخدم / المعرف الوظيفي</label>
                <input type="text" id="login-username" class="form-control" placeholder="أدخل اسم المستخدم أو المعرف" autocomplete="username" required>
            </div>

            <div class="form-group">
                <label for="login-password">كلمة المرور</label>
                <div class="password-wrapper">
                    <input type="password" id="login-password" class="form-control" placeholder="أدخل كلمة المرور" autocomplete="current-password" required>
                    <button type="button" class="toggle-password-btn" onclick="togglePasswordVisibility()" title="إظهار أو إخفاء كلمة المرور" aria-label="إظهار أو إخفاء كلمة المرور">
                        <i id="toggle-password-icon" class="fa-solid fa-eye"></i>
                    </button>
                </div>
            </div>

            <button type="submit" id="login-submit-btn" class="btn-login">
                <i class="fa-solid fa-right-to-bracket"></i> دخول للنظام
            </button>
        </form>
    </div>

    <script>
        function getSupabaseClient() {
            if (window.bukhariSupabase) return window.bukhariSupabase;
            if (window.supabaseClient) return window.supabaseClient;

            const cfg = window.BUKHARI_SUPABASE_CONFIG || {};
            const url = cfg.url || localStorage.getItem("bukhari_supabase_url") || "";
            const anonKey = cfg.anonKey || localStorage.getItem("bukhari_supabase_anon_key") || "";

            if (url && anonKey && window.supabase && typeof window.supabase.createClient === "function") {
                window.bukhariSupabase = window.supabase.createClient(url, anonKey);
                return window.bukhariSupabase;
            }
            return null;
        }

        function getStorageInstance() {
            const sb = getSupabaseClient();
            if (sb && typeof createBukhariStorage === "function") {
                try {
                    return createBukhariStorage(sb);
                } catch (e) {
                    console.warn("تعذر تهيئة createBukhariStorage:", e);
                }
            }
            return null;
        }

        function togglePasswordVisibility() {
            const input = document.getElementById("login-password");
            const icon = document.getElementById("toggle-password-icon");
            if (!input || !icon) return;

            const isHidden = input.type === "password";
            input.type = isHidden ? "text" : "password";
            icon.classList.toggle("fa-eye", !isHidden);
            icon.classList.toggle("fa-eye-slash", isHidden);
        }

        function showError(msg) {
            const errBox = document.getElementById("login-error");
            errBox.textContent = msg;
            errBox.style.display = "block";
        }

        function hideError() {
            const errBox = document.getElementById("login-error");
            if (errBox) errBox.style.display = "none";
        }

        function setLoginLoading(isLoading) {
            const btn = document.getElementById("login-submit-btn");
            if (!btn) return;
            btn.disabled = isLoading;
            btn.dataset.origHtml = btn.dataset.origHtml || btn.innerHTML;
            btn.innerHTML = isLoading
                ? '<i class="fa-solid fa-spinner fa-spin"></i> جاري التحقق...'
                : btn.dataset.origHtml;
        }

        // الأدمن والمدير العام لهما نفس الصلاحية والتوجيه
        function redirectByRole(role) {
            const r = String(role || "").trim().toLowerCase();
            if (
                r === "admin" ||
                r === "general_manager" ||
                r === "gm" ||
                r === "مدير عام" ||
                r === "manager" ||
                r === "أدمن"
            ) {
                window.location.href = "system.html";
            } else if (r === "supervisor" || r === "إداري") {
                window.location.href = "admin.html";
            } else if (r === "teacher" || r === "معلم") {
                window.location.href = "teacher.html";
            } else if (r === "monitor" || r === "مشرف حلقة" || r === "مشرف") {
                window.location.href = "supervisor.html";
            } else {
                window.location.href = "system.html";
            }
        }

        async function handleLogin(event) {
            event.preventDefault();
            hideError();

            const username = document.getElementById("login-username").value.trim();
            const password = document.getElementById("login-password").value;

            if (!username || !password) {
                showError("يرجى إدخال اسم المستخدم وكلمة المرور.");
                return;
            }

            setLoginLoading(true);
            try {
                const storage = getStorageInstance();
                if (!storage) {
                    showError("تعذر الاتصال بخدمة التحقق السحابية، تأكد من إعدادات الاتصال.");
                    return;
                }

                const { profile } = await storage.loginWithStaffId(username, password);
                sessionStorage.setItem("current_user_name", profile.full_name);
                sessionStorage.setItem("current_user_role", profile.role);
                sessionStorage.setItem("current_staff_id", profile.staff_id);
                redirectByRole(profile.role);
            } catch (err) {
                showError(err?.message || "بيانات الدخول غير صحيحة أو الحساب مجمّد.");
            } finally {
                setLoginLoading(false);
            }
        }

        window.addEventListener("DOMContentLoaded", async () => {
            const storage = getStorageInstance();
            if (!storage) return;

            try {
                const profile = await storage.getCurrentStaffProfile();
                if (profile && profile.role) {
                    sessionStorage.setItem("current_user_name", profile.full_name);
                    sessionStorage.setItem("current_user_role", profile.role);
                    sessionStorage.setItem("current_staff_id", profile.staff_id);
                    redirectByRole(profile.role);
                }
            } catch {
                // لا توجد جلسة نشطة بعد
            }
        });
    </script>
</body>
</html>
